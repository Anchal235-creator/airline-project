<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; }

    body, html { height:100%; overflow: hidden; }

    /* Animated Sunrise Background */
    .bg-sky {
      position: fixed; inset: 0;
      background: linear-gradient(-45deg, #001b4a, #004e92, #ff7e5f, #feb47b);
      background-size: 400% 400%;
      animation: skyMove 15s ease infinite;
      z-index: -1;
    }

    @keyframes skyMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    /* Ticket Card */
    .ticket {
      width: 380px;
      background: #fdfdfd;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      overflow: hidden;
      animation: slideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);

      --notch-size: 20px;
      mask-image: radial-gradient(circle at left 78%, transparent var(--notch-size), black calc(var(--notch-size) + 1px)),
                  radial-gradient(circle at right 78%, transparent var(--notch-size), black calc(var(--notch-size) + 1px));
      -webkit-mask-image: radial-gradient(circle at 0 78%, transparent var(--notch-size), black calc(var(--notch-size) + 0.5px)),
                          radial-gradient(circle at 100% 78%, transparent var(--notch-size), black calc(var(--notch-size) + 0.5px));
      mask-composite: intersect; 
    }

    @keyframes slideIn {
      from { transform: translateY(50px) rotate(-5deg); opacity: 0; }
      to { transform: translateY(0) rotate(0); opacity: 1; }
    }

    /* Header */
    .ticket-header {
      background-color: #00205b; 
      padding: 25px 30px 20px;
      color: white;
      border-bottom: 4px solid #ffb400;
    }

    .airline-brand {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 2px;
      font-size: 24px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .flight-class {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .ticket-body { padding: 30px; }

    .input-group { margin-bottom: 20px; }

    .input-group label {
      display: block;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      border: none;
      border-bottom: 2px solid #ddd;
      background: transparent;
      padding: 5px 0;
      font-family: 'Courier New', monospace; 
      font-size: 18px;
      font-weight: 700;
      color: #00205b;
      transition: 0.3s;
      outline: none;
    }

    .input-group input:focus { border-color: #ffb400; }

    .divider {
      border-top: 2px dashed #ccc;
      margin: 20px -30px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #00205b;
      color: white;
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button:hover {
      background-color: #00338d;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,32,91,0.3);
    }

    .barcode-strip {
      height: 35px;
      margin-top: 25px;
      background: repeating-linear-gradient(
        90deg, #333, #333 2px, transparent 2px, transparent 4px,
        #333 4px, #333 8px, transparent 8px, transparent 9px
      );
      opacity: 0.7;
    }

    .small {
      margin-top: 15px;
      text-align: center;
    }

    .small a {
      color: #00205b;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="bg-sky"></div>

<div class="overlay">
  <div class="ticket">

    <div class="ticket-header">
      <div class="airline-brand">
        <span>SKY HIGH</span>
        <span style="font-size:18px;">✈</span>
      </div>
      <div class="flight-class">Passenger Login Portal</div>
    </div>

    <div class="ticket-body">
      <form id="userLoginForm">


        <div class="input-group">
          <label for="email">Email ID</label>
          <input type="email" id="email" required />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>

        <div class="divider"></div>

        <button>Login</button>

        <p id="loginError" style="color:red; margin-top:10px; display:none;"></p>


        <div class="barcode-strip"></div>

        <div class="small">
  New user? <a href="signup.html">Create Account</a>
  <br><br>

  
</div>


      </form>
    </div>

  </div>
</div>

<script>
document.getElementById("userLoginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const res = await fetch("http://localhost:5000/user/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
            throw new Error("Invalid credentials");
        }

        // SUCCESS
        window.location.href = "flights.html";

    } catch (err) {
        const errEl = document.getElementById("loginError");
        errEl.textContent = "Login failed. Please check your email or password.";
        errEl.style.display = "block";
    }
});
</script>


</body>
</html>
